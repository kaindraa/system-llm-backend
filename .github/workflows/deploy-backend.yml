name: Fly Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy backend to Fly.io
    runs-on: ubuntu-latest
    concurrency: deploy-group   # ensure only one deploy runs at a time
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Stop worker before migration
        run: flyctl scale count 0 --process-group worker -a system-llm-backend --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Restore ingestion worker
        if: ${{ success() }}
        run: flyctl scale count 1 --process-group worker -a system-llm-backend --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
