# fly.toml — System LLM backend (FastAPI)
# Deploy: fly deploy   (after `fly launch --no-deploy` created the app + secrets are set)

app = 'system-llm-backend'
primary_region = 'sin'

[build]

# NOTE: no [deploy] release_command — the image ENTRYPOINT (entrypoint.sh)
# always exec's uvicorn and ignores the release command, so a release machine
# never exits and the deploy times out. Run DB migrations manually instead:
#   fly console -a system-llm-backend -C "alembic upgrade head"

[env]
  PORT = "8000"
  # No CLOUD_SQL_INSTANCES -> entrypoint.sh skips Cloud SQL Proxy and runs uvicorn
  # directly against DATABASE_URL (Supabase session pooler).

[processes]
  web = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
  worker = "python -m app.worker"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1   # keep one warm instance to avoid auth/chat cold starts
  processes = ['web']

  [[http_service.checks]]
    interval = '30s'
    timeout = '30s'
    grace_period = '60s'     # allow warm-up + transient load without flapping unhealthy
    method = 'GET'
    path = '/health'

[[vm]]
  processes = ['web']
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[[vm]]
  processes = ['worker']
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
