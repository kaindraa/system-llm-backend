# fly.toml — System LLM backend (FastAPI)
# Deploy: fly deploy   (after `fly launch --no-deploy` created the app + secrets are set)

app = 'system-llm-backend'
primary_region = 'sin'

[build]

[env]
  PORT = "8000"
  # No CLOUD_SQL_INSTANCES -> entrypoint.sh skips Cloud SQL Proxy and runs uvicorn
  # directly against DATABASE_URL (Supabase session pooler).

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0   # scale to zero when idle (cold start ~5-15s on first request)
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '40s'     # langchain import + DB connect on boot
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
